[project]
name = "rl-playground"
version = "0.1.0"
description = "Reinforcement learning experiments on custom Gymnasium environments, trained with PPO and visualised live."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.1",
    "matplotlib>=3.11.2",
    "numpy>=1.26",
    "pillow>=10.0",
    "pygame-ce>=2.5",
    "rich>=13.0",
    "stable-baselines3>=2.4",
    "tensorboard>=2.15",
    "torch>=2.3",
    "tqdm>=4.66",
]

[project.scripts]
rlp = "rl_playground.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rl_playground"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
